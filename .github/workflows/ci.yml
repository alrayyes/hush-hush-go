# The gate. Every command in here has a twin in lefthook.yml, so a green
# pre-commit means a green pipeline and neither can drift into being the only
# place a rule is enforced.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.13.1

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: gofmt
        run: gofmt -l . | (! grep .)

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test (hand-written layer only; see design.md's testing layers)
        # gotestsum wraps go test for the JUnit report Test Analytics
        # needs, on top of the same human-readable output go test already
        # gave.
        run: >-
          go tool gotestsum --junitfile junit.xml --
          -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Report coverage
        run: |
          go tool cover -func=coverage.out | tail -1 |
            awk '{ print "**Coverage: " $3 "**" }' >> "$GITHUB_STEP_SUMMARY"
      - name: Build the coverage reports
        # Cobertura XML for tools that read it, and the HTML view for a
        # person. `pages` publishes both next to the JUnit file.
        run: |
          go tool gocover-cobertura < coverage.out > coverage.xml
          go tool cover -html=coverage.out -o coverage.html
      - name: Keep the reports for pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-reports
          path: |
            junit.xml
            coverage.out
            coverage.xml
            coverage.html
          if-no-files-found: error
          retention-days: 1
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Dependabot PR doesn't get repo secrets by default (GitHub's
          # own restriction, not a misconfiguration here) - CODECOV_TOKEN
          # is empty on that run, and this repo's branch protection makes
          # Codecov refuse a tokenless upload ("Token required because
          # branch is protected"). That's an upload hiccup on an
          # unprivileged run, not a real test regression - true here
          # would fail every Dependabot PR's CI on that basis alone
          # (confirmed on the sibling hush-hush-php repo's PRs #13/#14,
          # where the tests themselves passed clean).
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        # Runs even on a failed test step - a red PR is exactly what Test
        # Analytics exists to explain.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...

  gomod:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod edit -fmt
        run: go mod edit -fmt go.mod && git diff --exit-code go.mod

      # go.mod's module path must carry a /vN suffix matching the major
      # version once that major is 2 or higher (Go's semantic import
      # versioning: https://go.dev/ref/mod#major-version-suffixes).
      # release-please computes the next version from Conventional Commits
      # and stages it into .release-please-manifest.json on its own release
      # PR, before that PR's merge is what actually cuts the tag - this
      # step reads the same file, so it runs (and can fail) on that PR too,
      # catching a mismatch before it ships as an unreachable tag rather
      # than after. Nothing else in this pipeline ties the two together:
      # bumping the module path is still a manual edit, same as the fix in
      # this commit - see openspec/design.md's "Update, later audit" note
      # and alrayyes/hush-hush-go#86/#170, where that manual step was
      # missed three major bumps running.
      - name: go.mod module path matches the version about to release
        run: |
          module_path=$(go mod edit -json | jq -r '.Module.Path')
          manifest_version=$(jq -r '."."' .release-please-manifest.json)
          manifest_major=${manifest_version%%.*}

          if [ "$manifest_major" -ge 2 ]; then
            expected="${module_path%/v*}/v${manifest_major}"
            if [ "$module_path" != "$expected" ]; then
              echo "::error::go.mod declares module path '$module_path', but .release-please-manifest.json's version ($manifest_version) requires the '/v${manifest_major}' suffix (expected '$expected'). Run: go mod edit -module=$expected, update every internal import, then re-run go build/go test." >&2
              exit 1
            fi
          elif [[ "$module_path" =~ /v[0-9]+$ ]]; then
            echo "::error::go.mod declares module path '$module_path' with a version suffix, but .release-please-manifest.json's version ($manifest_version) is major $manifest_major, which must NOT carry a /vN suffix." >&2
            exit 1
          fi

  # Pinning a dependency stops it drifting; it says nothing about the
  # pinned version having a known CVE since. Separate from the update pull
  # request Dependabot raises - this runs on every push, whatever's pinned
  # right now. Every other repo in the family already has an equivalent
  # (composer audit/pip-audit/npm audit/govulncheck); this repo was the
  # one gap.
  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: govulncheck ./...

  # Proves the generated client wasn't hand-edited: regenerating from the
  # pinned submodule commit must produce a byte-identical file. See
  # design.md's "Generated/hand-written boundary" decision.
  codegen-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go generate ./...
      - run: git diff --exit-code internal/genclient/client.gen.go

  markdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: bun install
        run: bun install --frozen-lockfile
      - name: bun.lock stays at lockfileVersion 1 (Dependabot can't parse 2 - see #47)
        run: |
          grep -q '"lockfileVersion": 1,' bun.lock
      - name: prettier --check
        run: bun run format:check
      - name: markdownlint
        run: bun run lint:md

  # Mechanics: grammar, spelling, the phonetic article. A right answer, so
  # this one gates rather than advises.
  grammar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/alrayyes/ltex-cli-plus:18.7.0@sha256:22452e86a130e528d526b60792926002983fcbf732bff09bd4e843d22816e4ea
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/lint-ltex.sh

  # Style: house voice, weasel words, corporate speak. Advice rather than a
  # verdict - MinAlertLevel in .vale.ini prints it, and only Vale.Terms
  # takes the job down.
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/lint-vale.sh

  # Contract-test the client against a mock server built from the same pinned
  # spec, per rules/sdk-generation.md's "testing against the spec, not a
  # hand-written stub".
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start Prism mock from the pinned spec
        run: |
          docker run -d --name prism -p 4010:4010 \
            -v "$(pwd)/hush-hush/api:/spec:ro" \
            stoplight/prism:5@sha256:3f6d29e31bfe0b99587f0f6f79c423858dd6a2ea7e1e4658273ed930a78a9acf mock -h 0.0.0.0 -m false /spec/openapi.yaml
          # -m false: Prism's default multiprocess (Node cluster) mode
          # crashes on startup in this image with "Cannot read properties
          # of undefined (reading 'isPrimary')" — confirmed by reproducing
          # locally; single-process mode is unaffected and plenty for a
          # test-only mock.
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4010 >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Run contract tests against the mock
        run: go test -tags=contract ./contract/...
        env:
          HUSH_HUSH_BASE_URL: http://localhost:4010
      - name: Prism logs
        if: failure()
        run: docker logs prism

  # Records the client's real interactions as a Pact consumer contract.
  # Provider verification against hush-hush's actual server has to run in
  # hush-hush's own CI (see design.md's Risks — an external dependency this
  # repo can't wire up unilaterally); this job's job is only to keep
  # producing an up-to-date pact file for that to consume.
  pact-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install the Pact native library
        # Installs the same version go.mod pins, not a second independent
        # pin here — a mismatch (e.g. Dependabot bumping go.mod without
        # this line) breaks the link step with a cryptic
        # "undefined reference to pactffi_..." from cgo, confirmed live.
        run: |
          pact_go_version=$(go list -m -f '{{.Version}}' github.com/pact-foundation/pact-go/v2)
          go install "github.com/pact-foundation/pact-go/v2@${pact_go_version}"
          sudo "$(go env GOPATH)/bin/pact-go" -l WARN install
      - name: Run Pact consumer tests
        run: go test -tags=pact ./pact/...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hush-hush-go-pact
          path: pact/pacts/*.json

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: commitlint
        run: |
          bunx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose

  # Assembles the site the reports are published from, on every run. A pull
  # request builds it too, so a broken staging step fails before the merge;
  # only a push to main uploads it as the Pages artifact. No `environment:`
  # here: the github-pages environment is limited to main, and a job that
  # declares it can't run on a pull request.
  assemble-reports:
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-reports
          path: _go-reports
      - name: Stage the site
        run: |
          mkdir -p _site/reports/tests _site/reports/coverage
          cp _go-reports/junit.xml _site/reports/tests/junit.xml
          cp _go-reports/coverage.html _site/reports/coverage/index.html
          cp _go-reports/coverage.xml _go-reports/coverage.out _site/reports/coverage/
          cp scripts/reports-index.html _site/reports/index.html
      - name: Upload the site for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  # Deploys the assembled site to GitHub Pages, on a push to main only. A
  # deploy replaces the whole site, so `test` has to have passed: a red run
  # publishes nothing and the last green set stays up. The other jobs gate it
  # too, so a report never goes live from a commit that fails CI.
  # `commits` only runs on pull requests, so it is skipped here;
  # `!failure() && !cancelled()` lets the deploy run past that skip while
  # still stopping on a failed or cancelled need.
  pages:
    needs:
      [
        actionlint,
        lint,
        test,
        build,
        gomod,
        govulncheck,
        codegen-drift,
        markdown,
        grammar,
        style,
        contract,
        pact-consumer,
        commits,
        assemble-reports,
      ]
    if: ${{ !failure() && !cancelled() && needs.assemble-reports.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check the published coverage report is live
        # The deploy succeeds whether or not the URL answers, so fetch the
        # real file. The retries cover the CDN catching up.
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 10 \
            --retry-all-errors --output coverage.xml \
            "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
