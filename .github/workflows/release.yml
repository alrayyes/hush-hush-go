# Nobody picks a version by hand for hand-written-code changes:
# release-please reads Conventional Commits on main and keeps a release pull
# request open with the next version and changelog entry. For a
# regeneration pull request specifically, the commit message's bump marker
# is set by codegen.yml from the openapi-diff classification, not written by
# a person — see design.md's "Versioning via spec diff" decision. Either way,
# release-please is what turns the landed commit message into a tag and a
# GitHub release; there's nothing to build onto it afterward — this is a
# library, not a binary, so consumers `go get` the tagged source directly.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Was Wandalen/wretry.action-wrapped for the transient-rate-limit
      # retry rules/releases.md documents — dropped for now because that
      # wrapper's nested-action composition doesn't actually invoke
      # release-please-action at all under GitHub's forced Node 20->24
      # runtime (2025-09-19 deprecation): the step reports success with
      # zero output and no release PR ever appears. No fixed wretry.action
      # release exists upstream (Wandalen/wretry.action#193, still open;
      # the one PR attempting it, #194, closed unmerged). hush-hush-go#103
      # has the diagnosis; re-add the wrapper once upstream ships a
      # Node 24-compatible release.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_TOKEN }}
