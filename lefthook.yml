# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.

pre-commit:
  jobs:
    - name: gofmt
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true

    - name: golangci-lint
      glob: "*.go"
      run: golangci-lint run ./...

    - name: gomod
      glob: "go.mod"
      run: go mod edit -fmt go.mod
      stage_fixed: true

    - name: prettier
      glob: "*.{md,yml,yaml}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: bunx markdownlint-cli2 {staged_files}

    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: test
      run: go test ./...

    - name: gomod
      run: go mod edit -fmt go.mod && git diff --exit-code go.mod

    - name: prettier
      run: bun run format:check

    - name: markdownlint
      run: bun run lint:md
